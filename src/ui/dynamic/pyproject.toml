[project]
name = "rootview-web"
version = "0.1.0"
description = "RootView web server - GUI for the KVM/LibVMI eBPF rootkit detection engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
rootview-web = "rootview_web.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rootview_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
