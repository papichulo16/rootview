[project]
name = "rootview"
version = "0.1.0"
description = "Introspection of running KVM guests through KVMI: VMI primitives and tooling over librootview.so"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rootview", "rootview.*"]
